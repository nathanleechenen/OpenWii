<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shooting Range — OpenWii</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; cursor: none;
    background: #7cc0f0; color: #23411c;
    font: 500 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
  }
  canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }

  #hud { position: absolute; inset: 0; pointer-events: none; }
  #card, #card2 {
    position: absolute; top: 24px; background: #ffffffd9;
    border: 1px solid #bcd9a8; border-radius: 14px; padding: 10px 18px 12px;
    box-shadow: 0 4px 14px #2a501f22; min-width: 128px;
  }
  #card { left: 28px; border-top: 5px solid #e2483d; }
  #card2 { right: 28px; text-align: right; border-top: 5px solid #2f7de1; }
  .plabel { font-size: 12px; font-weight: 800; letter-spacing: .12em; }
  #card .plabel { color: #e2483d; }
  #card2 .plabel { color: #2f7de1; }
  #score, #score2 { font-size: 30px; font-weight: 800; line-height: 1.15; }
  #meta, #meta2 { font-size: 13px; color: #5d7a4e; }
  #clock {
    position: absolute; left: 50%; top: 24px; transform: translateX(-50%);
    background: #ffffffd9; border: 1px solid #bcd9a8; border-radius: 999px;
    padding: 8px 22px; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums;
    box-shadow: 0 4px 14px #2a501f22;
  }
  #keys { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
          font-size: 11px; color: #3d5c33; text-shadow: 0 1px 0 #ffffff88; }
  #keys a { color: inherit; pointer-events: auto; }
  #link { position: absolute; right: 30px; bottom: 24px; display: flex; align-items: center;
          gap: 9px; font-size: 13px; color: #41603a; background: #ffffffd0;
          border: 1px solid #bcd9a8; padding: 9px 14px; border-radius: 999px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #9dbb8e; }
  .dot.on { background: #2fb56b; }
  #debug { position: absolute; right: 30px; top: 66px; margin: 0; display: none;
           background: #ffffffd9; border: 1px solid #bcd9a8; border-radius: 12px;
           padding: 13px 15px; font: 12px/1.6 ui-monospace, Menlo, monospace;
           color: #41603a; white-space: pre; }
  #debug.on { display: block; }

  #overlay { position: absolute; inset: 0; display: grid; place-items: center; z-index: 5;
             background: radial-gradient(ellipse at 50% 40%, #eaf7ffee, #a9d9f5f2 72%); }
  #overlay.hide { display: none; }
  .panel { text-align: center; max-width: 640px; padding: 0 30px; }
  .panel h1 { font-size: 54px; margin: 0 0 8px; font-weight: 800; letter-spacing: -0.03em;
              color: #23411c; }
  .panel h1 em { font-style: normal;
    background: linear-gradient(120deg, #f2a53a, #e2483d);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .panel p { color: #4a6b3e; margin: 0 auto 24px; max-width: 430px; }
  .stat { display: inline-block; margin: 0 10px 20px; }
  .stat b { display: block; font-size: 30px; color: #23411c; }
  .stat span { font-size: 12px; color: #5d7a4e; text-transform: uppercase; letter-spacing: .1em; }
  .slots { display: flex; justify-content: center; gap: 14px; margin: 0 0 22px; }
  .slot {
    padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 15px;
    background: #ffffffcc; border: 2px solid #bcd9a8; color: #4a6b3e;
  }
  .slot.p1 { border-color: #e2483d; color: #b8322a; }
  .slot.p2 { border-color: #2f7de1; color: #2362b3; }
  .slot.off { border-color: #bcd9a8; color: #7d9770; border-style: dashed; }
  .slot.ready { color: #fff; }
  .slot.p1.ready { background: #e2483d; }
  .slot.p2.ready { background: #2f7de1; }
  .pcols { display: flex; justify-content: center; gap: 22px; margin: 0 0 22px; }
  .pcol {
    min-width: 190px; padding: 14px 18px 16px; border-radius: 16px;
    background: #ffffffcc; border: 2px solid #bcd9a8;
  }
  .pcol.p1 { border-color: #e2483d; }
  .pcol.p2 { border-color: #2f7de1; }
  .pcol.won { box-shadow: 0 0 0 4px #ffd75e, 0 8px 24px #2a501f33; }
  .pname { font-size: 14px; font-weight: 800; letter-spacing: .12em; }
  .pcol.p1 .pname { color: #e2483d; }
  .pcol.p2 .pname { color: #2f7de1; }
  .pscore { font-size: 54px; font-weight: 800; line-height: 1.1; color: #23411c; }
  .pline { font-size: 13px; color: #5d7a4e; }
  .cta { font-size: 14px; color: #4a6b3e; }
  .cta strong { color: #23411c; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="card">
    <div class="plabel">P1</div>
    <div id="score">0</div>
    <div id="meta">0/0 hits</div>
  </div>
  <div id="clock">60.0s</div>
  <div id="card2" style="display:none">
    <div class="plabel">P2</div>
    <div id="score2">0</div>
    <div id="meta2">0/0 hits</div>
  </div>
  <div id="keys"><a href="/">← Games</a> · point at a target · <b>A</b>/click fires ·
    first shot takes it · gold &amp; balloons pay big · don't shoot the bombs · <b>D</b> debug</div>
  <div id="link"><span class="dot" id="dot"></span><span id="link-t">no remote connected</span></div>
  <pre id="debug"></pre>
</div>

<div id="overlay">
  <div class="panel" id="panel">
    <h1>🎯 <em>Shooting Range</em></h1>
    <p>Loading the meadow…</p>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Blockcraft — OpenWii</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101418; color: #eaf0ff;
    font: 500 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #link { position: absolute; right: 18px; top: 14px; display: flex; align-items: center;
    gap: 9px; font-size: 13px; color: #a9bcdc; background: #0b1226cc;
    border: 1px solid #2b3a5e; padding: 8px 14px; border-radius: 999px;
    z-index: 6; pointer-events: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4b5c80; }
  .dot.on { background: #2fb56b; }
  #overlay { position: absolute; inset: 0; display: grid; place-items: center; z-index: 5;
    background: radial-gradient(ellipse at 50% 40%, #243044ee, #0d1219f5 72%); cursor: pointer; }
  #overlay.hide { display: none; }
  .panel { text-align: center; max-width: 640px; padding: 0 30px; }
  .panel h1 { font-size: 46px; margin: 0 0 8px; font-weight: 800; }
  .panel p { color: #9fb2d4; margin: 0 auto 12px; max-width: 540px; }
  #note { color: #ff9b9b; min-height: 1.5em; }
</style>
</head>
<body>
<iframe id="game" src="blockcraft.html" allow="autoplay; fullscreen" title="Blockcraft"></iframe>

<div id="link"><span class="dot" id="dot"></span><span id="link-t">no remote connected</span></div>

<div id="overlay">
  <div class="panel">
    <h1>🧱 Blockcraft</h1>
    <p>Tap to start, then press Play in the game. Walk, jump and place blocks with the
       on-screen touch controls. Tilt the phone to look around, press <b>A</b> on the
       phone to break blocks, and <b>B</b> to leave.</p>
    <div id="note"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="adapter.js"></script>
</body>
</html>
